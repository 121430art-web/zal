<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; style-src 'self' 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Зал">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Зал</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --text:#e8eaef; --muted:#98a0b3; --acc:#5b9cff; --ok:#3ddc97; --warn:#ffb454; --rec:#ffd166;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 0 calc(74px + env(safe-area-inset-bottom))}
  .ver{position:absolute;right:16px;top:18px;font-size:11px;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  header{position:relative}
  header{padding:18px 16px 10px}
  h1{font-size:20px;margin:0 0 4px;font-weight:650;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:14px}
  main{padding:0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
  .exhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
  .exname{font-weight:600;font-size:16px}
  .plan{color:var(--muted);font-size:13px;white-space:nowrap}
  .hint{color:var(--warn);font-size:13px;margin:2px 0 10px}
  .hint.muted{color:var(--muted)}
  .sets{display:flex;flex-direction:column;gap:8px}
  .set{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center}
  .set.wu{grid-template-columns:52px 1fr 1fr 44px;opacity:.75}
  .n{color:var(--muted);font-size:13px;text-align:center}
  .n.wu{font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  input[type=number]{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px 8px;font-size:16px;text-align:center;-moz-appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0}
  .chk{width:44px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
    color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .chk.on{background:rgba(61,220,151,.14);border-color:rgba(61,220,151,.5);color:var(--ok)}
  .row{display:flex;gap:8px;align-items:center}
  button{font:inherit}
  .btn{background:var(--acc);color:#08101f;border:0;border-radius:12px;padding:12px 16px;
    font-weight:650;width:100%;cursor:pointer}
  .btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  .btn:active{transform:translateY(1px)}
  .nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,17,21,.96);
    border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:20}
  .nav button{flex:1;background:none;border:0;color:var(--muted);font-size:12px;padding:6px 0;cursor:pointer}
  .nav button.on{color:var(--text)}
  .nav .ico{display:block;font-size:18px;margin-bottom:2px}
  .empty{color:var(--muted);text-align:center;padding:30px 10px}
  .hist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .hbar{display:grid;grid-template-columns:74px 1fr 62px;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--card2);overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--acc)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--card2);
    border:1px solid var(--line);font-size:12px;color:var(--muted)}
  .pill.rec{color:#241c00;background:var(--rec);border-color:var(--rec);font-weight:700}
  .done{background:rgba(61,220,151,.1);border-color:rgba(61,220,151,.35)}
  .tbtn{display:inline-block;margin-left:6px;border:1px solid var(--line);border-radius:999px;
    padding:1px 7px;cursor:pointer;color:var(--muted)}
  details.tech{margin:0 0 10px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:8px 10px}
  details.tech summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
  details.tech summary::-webkit-details-marker{display:none}
  details.tech summary:before{content:"▸ ";color:var(--acc)}
  details.tech[open] summary:before{content:"▾ "}
  details.tech ul{margin:8px 0 6px;padding-left:18px;font-size:14px}
  details.tech li{margin:4px 0}
  details.tech .bad{font-size:13px;color:var(--warn);margin-top:6px}
  details.tech a{display:inline-block;margin-top:8px;font-size:13px;color:var(--acc);text-decoration:none}
  .wr{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--line)}
  .wrow{display:grid;grid-template-columns:1fr auto 70px;gap:10px;font-size:14px;padding:6px 0;
    border-bottom:1px solid var(--line);color:var(--text)}
  .wrow span:first-child{color:var(--muted)}
  .wrow .down{color:var(--ok);text-align:right}
  .wrow .up{color:var(--warn);text-align:right}
  .wrow span:last-child{text-align:right}
  .src{display:inline-block;margin-top:8px;font-size:12px;color:var(--acc);text-decoration:none}
  .myth{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .myth span{color:var(--muted);font-size:13px}
  .myth:last-child{border-bottom:0}
  .note{font-size:13px;color:var(--text);background:rgba(91,156,255,.1);border-left:3px solid var(--acc);
    border-radius:8px;padding:7px 10px;margin:0 0 8px}
  .notebtn{font-size:12px;color:var(--muted);margin:0 0 10px;cursor:pointer}
  .vrow{display:grid;grid-template-columns:96px 1fr 56px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
  .vrow .vt{color:var(--muted)}
  .plate{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .plate span{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;
    padding:16px;z-index:60}
  .modal.show{display:flex}
  .modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:430px;
    max-height:86vh;overflow:auto}
  .modal h3{margin:0 0 6px;font-size:17px}
  .modal label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  .modal input,.modal textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:11px 10px;font:inherit}
  .modal .acts{display:flex;gap:8px;margin-top:16px}
  .toast{position:fixed;left:12px;right:12px;bottom:calc(120px + env(safe-area-inset-bottom));background:var(--card2);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;display:none;z-index:70;
    box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .erow{display:grid;grid-template-columns:1fr auto 28px;gap:10px;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
  .erow:last-of-type{border-bottom:0}
  .erow .eplan{color:var(--muted);font-size:13px;white-space:nowrap}
  .erow .del{color:var(--muted);text-align:center;font-size:16px}
  .timer{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));
    background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;
    display:none;align-items:center;gap:10px;z-index:21;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .timer.show{display:flex}
  .timer .t{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:74px}
  .timer .lbl{font-size:12px;color:var(--muted);flex:1}
  .timer button{background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer}
  .timer.finished{border-color:var(--ok);background:rgba(61,220,151,.12)}
  .warmup{background:var(--card2);border-radius:12px;padding:10px;margin:0 0 10px}
  .warmup .wt{font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
  .warmup .wr{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:3px 0}
  .bwbox{display:flex;gap:8px;align-items:center}
  .bwbox input{max-width:110px}
  svg.chart{width:100%;height:120px;display:block;margin-top:8px}
  .k{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="ver" id="ver">v2.4</div>
  <h1 id="title">Сегодня</h1>
  <div class="sub" id="subtitle"></div>
</header>
<main id="app"></main>
<div class="timer" id="timer">
  <div class="t" id="timerT">1:30</div>
  <div class="lbl" id="timerL">отдых</div>
  <button id="timerPlus">+15</button>
  <button id="timerStop">стоп</button>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<div class="nav">
  <button data-tab="today" class="on"><span class="ico">🏋️</span>Сегодня</button>
  <button data-tab="progress"><span class="ico">📈</span>Прогресс</button>
  <button data-tab="science"><span class="ico">🔬</span>Наука</button>
  <button data-tab="medic"><span class="ico">🩺</span>Медик</button>
  <button data-tab="settings"><span class="ico">⚙️</span>Ещё</button>
</div>
<script src="app.js" defer></script>
</body>
</html>
